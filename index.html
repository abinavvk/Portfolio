<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Abinav V.K. | Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
:root{color-scheme:dark;--bg:#060a18;--cy:#00e5ff;--pk:#ff2e97;--rd:#e8203a;--bl:#2358e6;--ch:#c9d3e6;--gn:#39ff88;--tx:#e8eefc;--mt:#93a0c0;--glass:rgba(16,24,56,.55);--ln:rgba(140,170,255,.2)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{background:var(--bg);color:var(--tx);font:400 1.05rem/1.7 'Inter',system-ui,sans-serif;overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom,0)}
a{color:inherit}
:focus-visible{outline:3px solid var(--cy);outline-offset:3px}
#rain{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.3}
main,footer{position:relative;z-index:1}
h1,h2{font-family:'Bangers','Inter',sans-serif;font-weight:400;letter-spacing:.04em;line-height:1}
.dock{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:50;display:flex;gap:2px;padding:6px;border-radius:99px;background:rgba(8,12,32,.6);border:1px solid var(--ln);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 10px 40px rgba(0,0,0,.4)}
.dock a{position:relative;text-decoration:none;font:600 .85rem 'Inter',sans-serif;padding:9px 18px;color:var(--mt);transition:color .25s}
.dock a:after{content:"";position:absolute;left:18px;right:18px;bottom:3px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--cy),var(--pk));box-shadow:0 0 10px var(--pk);transform:scaleX(0);transition:transform .3s}
.dock a:hover,.dock a.on{color:#fff}.dock a:hover:after,.dock a.on:after{transform:scaleX(1)}
.hero{position:relative;min-height:100svh;overflow:hidden;display:grid;align-items:center;padding:120px 24px 230px;background:linear-gradient(180deg,#070b22 0%,#1b0f4a 38%,#7a1c82 66%,#ff2e97 88%,#ff8a3d 100%)}
.sun{position:absolute;left:50%;bottom:90px;width:min(52vw,440px);aspect-ratio:1;border-radius:50%;translate:-50% 0;background:linear-gradient(#ffe066,#ff5e8a 55%,#ff2e97);-webkit-mask:repeating-linear-gradient(180deg,#000 0 12px,transparent 12px 16px);mask:repeating-linear-gradient(180deg,#000 0 12px,transparent 12px 16px);opacity:.85}
.hero:before{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:repeating-linear-gradient(105deg,transparent 0 26px,rgba(190,235,255,.16) 26px 27px);background-size:200px 200px;animation:rainfall .7s linear infinite}
@keyframes rainfall{to{background-position:-60px 200px}}
.city{position:absolute;left:0;bottom:44px;width:100%;height:42%;z-index:1}
.hero .city .lit{animation:flick 4s ease-in-out infinite alternate}
@keyframes flick{to{opacity:.55}}
.road{position:absolute;left:0;right:0;bottom:0;height:46px;z-index:2;background:linear-gradient(#0a1030,#04060f);border-top:2px solid var(--pk);box-shadow:0 -12px 40px rgba(255,46,151,.55)}
.car{position:absolute;bottom:14px;left:-200px;width:150px;z-index:2;animation:drive 16s linear infinite;filter:drop-shadow(0 0 10px rgba(255,46,151,.7))}
@keyframes drive{to{left:105%}}
.hw{position:relative;z-index:4;max-width:1160px;margin:auto;width:100%;display:grid;grid-template-columns:1.15fr .85fr;gap:30px;align-items:center}
.eyebrow{font:700 .78rem 'JetBrains Mono',monospace;color:var(--gn);letter-spacing:.2em;text-transform:uppercase;margin-bottom:16px}
h1{font:800 clamp(2.8rem,8.5vw,6rem)/1 'Inter',sans-serif;letter-spacing:-.03em;background:linear-gradient(110deg,var(--cy),#fff 30%,var(--pk) 55%,var(--cy) 85%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:holo 7s linear infinite;filter:drop-shadow(0 0 22px rgba(0,229,255,.35))}
@keyframes holo{to{background-position:-300% 0}}
.tag{margin:22px 0 34px;font:600 clamp(1rem,2.4vw,1.3rem)/1.6 'Inter',sans-serif;color:#fff;max-width:44ch}
.tag b{color:var(--cy);font-weight:600}.tag i{color:var(--pk);font-style:normal;padding:0 6px}
.btns{display:flex;gap:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 28px;border-radius:99px;font:600 .95rem 'Inter',sans-serif;text-decoration:none;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:transform .25s,box-shadow .25s,background .25s}
.btn.p{background:linear-gradient(120deg,var(--rd),var(--pk));border-color:transparent;box-shadow:0 8px 30px rgba(255,46,151,.45)}
.btn:hover{transform:translateY(-3px);box-shadow:0 10px 36px rgba(0,229,255,.5)}
